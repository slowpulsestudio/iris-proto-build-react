trigger:
  branches:
    include:
      - main

pr: none

parameters:
  - name: releaseTokens
    displayName: 'Publish tokens (stable release, manual only)'
    type: boolean
    default: false

  - name: releaseIcons
    displayName: 'Publish icons (stable release, manual only)'
    type: boolean
    default: false

  - name: releaseComponents
    displayName: 'Publish components (stable release, manual only)'
    type: boolean
    default: false

resources:
  repositories:
    - repository: pipelinetools
      type: git
      name: Starling/Pipeline-Tools

variables:
  - template: templates/variables.yml@pipelinetools

stages:
  # ──────────────────────────────────────────────────────
  # Validate — shared lint, test & build (runs every time)
  # ──────────────────────────────────────────────────────
  - stage: Validate
    displayName: 'Lint & Test'
    jobs:
      - job: LintAndTest
        displayName: 'Lint, Test & Build'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '22.x'

          - script: corepack enable
            displayName: 'Enable corepack / pnpm'

          - script: pnpm install --frozen-lockfile --ignore-scripts
            displayName: 'Install dependencies'

          - script: pnpm run tokens:build
            displayName: 'Build tokens'

          - script: pnpm run icons:build
            displayName: 'Build icons'

          - script: pnpm run lint
            displayName: 'Lint'

          - script: pnpm run test:coverage
            displayName: 'Unit tests'

          - script: pnpm run components:build
            displayName: 'Build components'

  # ──────────────────────────────────────────────────────
  # Release Tokens — manual stable publish
  # ──────────────────────────────────────────────────────
  - stage: ReleaseTokens
    displayName: 'Publish Tokens'
    dependsOn: Validate
    condition: and(succeeded(), eq('${{ parameters.releaseTokens }}', true), eq(variables['Build.Reason'], 'Manual'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: PublishTokens
        displayName: 'Publish tokens package'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '22.x'

          - script: corepack enable
            displayName: 'Enable corepack / pnpm'

          - script: pnpm install --frozen-lockfile --ignore-scripts
            displayName: 'Install dependencies'

          - script: pnpm run tokens:build
            displayName: 'Build tokens'

          - script: |
              printf 'registry=https://pkgs.dev.azure.com/1id/_packaging/OneIdentity/npm/registry/\nalways-auth=true\n' > Tokens/.npmrc
            displayName: 'Create publish .npmrc (untracked)'

          - task: npmAuthenticate@0
            displayName: 'Authenticate to Azure Artifacts'
            inputs:
              workingFile: $(Build.SourcesDirectory)/Tokens/.npmrc

          - script: pnpm run tokens:publish
            displayName: 'Publish to Azure Artifacts'

  # ──────────────────────────────────────────────────────
  # Release Icons — manual stable publish
  # ──────────────────────────────────────────────────────
  - stage: ReleaseIcons
    displayName: 'Publish Icons'
    dependsOn: Validate
    condition: and(succeeded(), eq('${{ parameters.releaseIcons }}', true), eq(variables['Build.Reason'], 'Manual'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: PublishIcons
        displayName: 'Publish icons package'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '22.x'

          - script: corepack enable
            displayName: 'Enable corepack / pnpm'

          - script: pnpm install --frozen-lockfile --ignore-scripts
            displayName: 'Install dependencies'

          - script: pnpm run icons:build
            displayName: 'Build icons'

          - script: |
              printf 'registry=https://pkgs.dev.azure.com/1id/_packaging/OneIdentity/npm/registry/\nalways-auth=true\n' > Icons/.npmrc
            displayName: 'Create publish .npmrc (untracked)'

          - task: npmAuthenticate@0
            displayName: 'Authenticate to Azure Artifacts'
            inputs:
              workingFile: $(Build.SourcesDirectory)/Icons/.npmrc

          - script: pnpm run icons:publish
            displayName: 'Publish to Azure Artifacts'

  # ──────────────────────────────────────────────────────
  # Release Components — preview on CI, stable on manual
  # ──────────────────────────────────────────────────────
  - stage: ReleaseComponents
    displayName: 'Publish Components'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: PublishComponents
        displayName: 'Publish components package'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '22.x'

          - script: corepack enable
            displayName: 'Enable corepack / pnpm'

          - script: pnpm install --frozen-lockfile --ignore-scripts
            displayName: 'Install dependencies'

          - script: pnpm run icons:build
            displayName: 'Build icons'

          - script: pnpm run components:build
            displayName: 'Build components'

          - task: npmAuthenticate@0
            displayName: 'Authenticate to Azure Artifacts'
            inputs:
              workingFile: $(Build.SourcesDirectory)/Components/dist/.npmrc

          - script: |
              cd Components/dist
              npm version "$(node -p "require('./package.json').version")-preview.$(Build.BuildId)" --no-git-tag-version
              npm publish --tag preview
            displayName: 'Publish preview to Azure Artifacts'
            condition: and(succeeded(), ne('${{ parameters.releaseComponents }}', true))

          - script: |
              cd Components/dist
              npm publish
            displayName: 'Publish stable release to Azure Artifacts'
            condition: and(succeeded(), eq('${{ parameters.releaseComponents }}', true), eq(variables['Build.Reason'], 'Manual'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
