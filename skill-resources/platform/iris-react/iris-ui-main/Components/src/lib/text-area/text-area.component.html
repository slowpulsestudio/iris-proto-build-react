<div
  class="iris-text-area__input-wrapper"
  [class.iris-text-area__input-wrapper--error]="effectiveHasError()"
  [class.iris-text-area__input-wrapper--disabled]="effectiveDisabled()"
  [class.iris-text-area__input-wrapper--readonly]="readonly()"
>
  <textarea
    class="iris-text-area__input"
    [placeholder]="placeholder()"
    [value]="valueState()"
    [disabled]="effectiveDisabled()"
    [readOnly]="readonly()"
    [attr.rows]="rows() ?? null"
    [style.resize]="resize()"
    [attr.aria-labelledby]="formField?.labelId ?? null"
    [attr.aria-invalid]="effectiveHasError() || null"
    [attr.aria-describedby]="formField?.activeDescriptionId() || null"
    [attr.maxlength]="countMax() > 0 ? countMax() : null"
    (input)="onInput($event)"
    (blur)="onBlur()"
  ></textarea>
</div>
