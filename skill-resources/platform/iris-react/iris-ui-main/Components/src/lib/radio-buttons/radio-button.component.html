<span class="iris-radio-button__control">
  <span class="iris-radio-button__circle" [class.iris-radio-button__circle--checked]="isChecked()">
    @if (isChecked()) {
      <span class="iris-radio-button__dot"></span>
    }
  </span>
</span>
<span class="iris-radio-button__label">
  <ng-content></ng-content>
</span>
@if (supportingText()) {
  <span class="iris-radio-button__supporting-text">{{ supportingText() }}</span>
}
