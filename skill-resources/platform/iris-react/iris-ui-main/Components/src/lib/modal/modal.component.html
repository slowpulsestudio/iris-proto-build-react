<dialog
  #dialogElement
  class="iris-modal-dialog"
  [class.iris-modal-dialog--backdrop]="hasBackdrop()"
  [class.iris-modal-dialog--closing]="isClosing()"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="subtitle() ? subtitleId : null"
  (cancel)="onNativeCancel($event)"
  (click)="onDialogClick($event)"
  (keydown)="onDialogClick($event)"
  tabindex="-1"
>
  <div
    #panelElement
    [class]="panelClassList()"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    role="presentation"
  >
    <header class="iris-modal__header">
      @if (titleIcon()) {
        <div class="iris-modal__title-icon">
          <iris-icon [name]="titleIcon()" [size]="24" [decorative]="true" />
        </div>
      }
      <div class="iris-modal__title-group">
        <h2 class="iris-modal__title" [id]="titleId">{{ title() }}</h2>
        @if (subtitle()) {
          <p class="iris-modal__subtitle" [id]="subtitleId">{{ subtitle() }}</p>
        }
      </div>
      @if (dismissable()) {
        <button class="iris-modal__dismiss" type="button" [attr.aria-label]="closeAriaLabel()" (click)="onDismiss()">
          <iris-icon name="X" [size]="16" [decorative]="true" />
        </button>
      }
    </header>

    <div class="iris-modal__body">
      <ng-content></ng-content>
      <ng-template #bodyOutlet></ng-template>
    </div>

    <footer [class]="footerClass()">
      <ng-content select="[irisModalFooter]"></ng-content>
      <ng-template #footerOutlet></ng-template>
    </footer>
  </div>
</dialog>
