<span class="iris-tag">
  @if (removable()) {
    <button
      class="iris-tag__action"
      type="button"
      [attr.aria-label]="removeAriaLabel()"
      (click)="onRemove($event)"
      (keydown)="onRemoveKeydown($event)"
    >
      <iris-icon name="X" [size]="16" [decorative]="true" />
    </button>
  }
  <span class="iris-tag__text">{{ text() }}</span>
</span>
