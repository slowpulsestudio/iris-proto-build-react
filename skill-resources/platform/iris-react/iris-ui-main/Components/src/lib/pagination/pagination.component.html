<nav class="iris-pagination" [class.iris-pagination--simplified]="type() === 'simplified'" [attr.aria-label]="ariaLabel()">
  @if (type() === 'default') {
    <button
      class="iris-pagination__item iris-pagination__item--nav"
      [disabled]="!hasPreviousPage()"
      (click)="goToPreviousPage()"
    >
      <iris-icon name="CaretLeft" [size]="16" [label]="'Previous page'"></iris-icon>
    </button>

    @for (page of visiblePages(); track page) {
      @if (page === 'separator') {
        <span class="iris-pagination__item iris-pagination__item--separator" aria-hidden="true">…</span>
      } @else {
        <button
          class="iris-pagination__item iris-pagination__item--page"
          [class.iris-pagination__item--active]="page === currentPage()"
          [attr.aria-current]="page === currentPage() ? 'page' : null"
          (click)="goToPage(page)"
        >
          {{ page }}
        </button>
      }
    }

    <button
      class="iris-pagination__item iris-pagination__item--nav"
      [disabled]="!hasNextPage()"
      (click)="goToNextPage()"
    >
      <iris-icon name="CaretRight" [size]="16" [label]="'Next page'"></iris-icon>
    </button>
  }

  @if (type() === 'simplified') {
    <button
      class="iris-pagination__item iris-pagination__item--label"
      [disabled]="!hasPreviousPage()"
      (click)="goToPreviousPage()"
    >
      <iris-icon name="CaretLeft" [size]="16" [decorative]="true"></iris-icon>
      <span>Previous</span>
    </button>

    <button
      class="iris-pagination__item iris-pagination__item--label"
      [disabled]="!hasNextPage()"
      (click)="goToNextPage()"
    >
      <span>Next</span>
      <iris-icon name="CaretRight" [size]="16" [decorative]="true"></iris-icon>
    </button>
  }
</nav>
