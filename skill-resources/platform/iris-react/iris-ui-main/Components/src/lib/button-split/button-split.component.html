<div
  class="iris-button-split"
  [class.iris-button-split--primary]="variant() === 'primary'"
  [class.iris-button-split--ghost]="variant() === 'ghost'"
>
  <button class="iris-button-split__action" [disabled]="disabled()" type="button" (click)="onPrimaryClick($event)">
    <span class="iris-button-split__label">{{ label() }}</span>
  </button>
  <button
    class="iris-button-split__toggle"
    [disabled]="disabled()"
    type="button"
    [attr.aria-label]="moreOptionsAriaLabel()"
    [irisMenu]="resolvedMenu()"
    [irisMenuPosition]="menuPosition()"
    (irisMenuItemSelected)="menuItemClick.emit($event)"
  >
    <iris-icon name="CaretDown" [size]="16" [decorative]="true" />
  </button>
</div>
