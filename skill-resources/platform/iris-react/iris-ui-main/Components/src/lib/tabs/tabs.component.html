<div class="iris-tabs" role="tablist" [attr.aria-label]="ariaLabel() || null">
  @for (item of items(); track item.value) {
    <button
      class="iris-tabs__item"
      [class.iris-tabs__item--active]="activeValueState() === item.value"
      (click)="select(item.value)"
      (keydown)="onKeydown($event)"
      role="tab"
      [attr.data-value]="item.value"
      [attr.aria-selected]="activeValueState() === item.value"
      [tabindex]="tabStopValue() === item.value ? 0 : -1"
    >
      <span class="iris-tabs__item-content">
        @if (item.icon) {
          <iris-icon [name]="item.icon" [size]="16" [decorative]="true" />
        }
        <span class="iris-tabs__label">{{ item.label }}</span>
        @if (item.counter !== undefined && item.counter !== null) {
          @if (item.counterType === 'action') {
            <span class="iris-tabs__counter iris-tabs__counter--action">{{ item.counter }}</span>
          } @else {
            <span class="iris-tabs__counter">({{ item.counter }})</span>
          }
        }
      </span>
    </button>
  }
</div>
