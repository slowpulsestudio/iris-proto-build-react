<span
  class="iris-icon"
  [style.--iris-icon-size.px]="size()"
  [style.--iris-icon-stroke-width]="strokeWidth()"
  [attr.aria-hidden]="decorative() ? 'true' : null"
  [attr.role]="decorative() ? null : 'img'"
  [attr.aria-label]="decorative() ? null : effectiveLabel()"
  [innerHTML]="svgContent()">
</span>
