<button
  class="iris-button"
  [class.iris-button--primary]="variant() === 'primary'"
  [class.iris-button--secondary]="variant() === 'secondary'"
  [class.iris-button--ghost]="variant() === 'ghost'"
  [class.iris-button--danger]="variant() === 'danger'"
  [class.iris-button--sm]="size() === 'sm'"
  [class.iris-button--lg]="size() === 'lg'"
  [class.iris-button--icon-text]="buttonType() === 'icon-text'"
  [class.iris-button--icon-only]="buttonType() === 'icon-only'"
  [disabled]="disabled()"
  [type]="type()"
>
  @if (buttonType() !== 'text-only' && iconName()) {
    <iris-icon [name]="iconName()" [size]="iconDisplaySize()" label="" [decorative]="true" />
  }
  <span class="iris-button__label" [class.iris-screen-reader-only]="buttonType() === 'icon-only'">
    <ng-content />
  </span>
</button>
