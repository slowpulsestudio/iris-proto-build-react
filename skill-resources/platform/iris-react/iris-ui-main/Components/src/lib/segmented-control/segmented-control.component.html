<div
  class="iris-segmented-control"
  role="tablist"
  (mousedown)="onMouseDown()"
  (focusin)="onFocusIn()"
>
  @for (item of items(); track item.value) {
    <button
      type="button"
      class="iris-segmented-control__item"
      [class.iris-segmented-control__item--active]="activeValueState() === item.value"
      (click)="select(item.value)"
      (keydown)="onKeydown($event)"
      role="tab"
      [attr.data-value]="item.value"
      [attr.aria-selected]="activeValueState() === item.value"
      [tabindex]="tabStopValue() === item.value ? 0 : -1"
      [disabled]="effectiveDisabled()"
      [attr.aria-label]="type() === 'icon-only' && item.iconName ? item.label : null"
      [irisTooltip]="item.label"
      [irisTooltipDisabled]="type() !== 'icon-only' || !item.iconName"
    >
      @if (type() !== 'text-only' && item.iconName) {
        <iris-icon [name]="item.iconName" [size]="20" [decorative]="true" />
      }
      @if (type() === 'text-only' || type() === 'icon-text' || !item.iconName) {
        <span class="iris-segmented-control__label">{{ item.label }}</span>
      }
    </button>
  }
</div>
