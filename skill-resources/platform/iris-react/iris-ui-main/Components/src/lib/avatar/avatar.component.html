<div
  class="iris-avatar"
  [class.iris-avatar--sm]="size() === 'sm'"
  [class.iris-avatar--md]="size() === 'md'"
  [class.iris-avatar--lg]="size() === 'lg'"
  [class.iris-avatar--face]="type() === 'face'"
  [class.iris-avatar--placeholder]="type() === 'placeholder'"
  [class.iris-avatar--nhi]="isNhiType()"
  [attr.aria-label]="alt() || initials()"
>
  @if (type() === 'face' && src()) {
    <img [src]="src()" [alt]="alt()" class="iris-avatar__image" />
  }
  @if (type() === 'placeholder') {
    <span class="iris-avatar__initials">{{ initials() }}</span>
  }
  @if (isNhiType() && nhiIconName()) {
    <iris-icon [name]="nhiIconName()" [size]="iconDisplaySize()" class="iris-avatar__icon" [decorative]="true" />
  }
</div>
