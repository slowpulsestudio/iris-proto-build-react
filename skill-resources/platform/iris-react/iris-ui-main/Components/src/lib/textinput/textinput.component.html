<div class="iris-textinput" [class.iris-textinput--lg]="size() === 'lg'">
  <div
    class="iris-textinput__input-wrapper"
    [class.iris-textinput__input-wrapper--error]="effectiveHasError()"
    [class.iris-textinput__input-wrapper--disabled]="effectiveDisabled()"
    [class.iris-textinput__input-wrapper--readonly]="readonly()"
  >
    @if (leadingIcon()) {
      <iris-icon
        class="iris-textinput__icon iris-textinput__icon--lead"
        [name]="leadingIcon()"
        [size]="16"
        [decorative]="true"
      />
    }
    <input
      class="iris-textinput__input"
      [placeholder]="placeholder()"
      [value]="valueState()"
      [disabled]="effectiveDisabled()"
      [readOnly]="readonly()"
      [attr.aria-labelledby]="formField?.labelId ?? null"
      [attr.aria-invalid]="effectiveHasError() || null"
      [attr.aria-describedby]="formField?.activeDescriptionId() || null"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
    @if (trailingIcon()) {
      <iris-icon
        class="iris-textinput__icon iris-textinput__icon--trail"
        [name]="trailingIcon()"
        [size]="16"
        [decorative]="true"
      />
    }
  </div>
</div>
