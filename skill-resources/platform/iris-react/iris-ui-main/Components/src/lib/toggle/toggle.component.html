<button
  class="iris-toggle"
  [class.iris-toggle--on]="checked()"
  [class.iris-toggle--disabled]="isDisabled()"
  [disabled]="isDisabled()"
  (click)="toggle()"
  role="switch"
  [attr.aria-checked]="checked()"
  type="button"
>
  <span class="iris-toggle__knob"></span>
  <span class="iris-screen-reader-only"><ng-content /></span>
</button>
