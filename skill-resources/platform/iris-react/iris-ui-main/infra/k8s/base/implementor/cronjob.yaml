apiVersion: batch/v1
kind: CronJob
metadata:
  name: implementor
  namespace: iris-ui
spec:
  schedule: "0 2 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: implementor
            azure.workload.identity/use: "true"
        spec:
          serviceAccountName: implementor
          restartPolicy: Never
          containers:
            - name: implementor
              image: starling.azurecr.io/oneidentity/iris-implementor:latest
              imagePullPolicy: Always
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              envFrom:
                - configMapRef:
                    name: implementor-config
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              volumeMounts:
                - name: secrets-store
                  mountPath: /mnt/secrets-store
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/implementor
          volumes:
            - name: secrets-store
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: implementor-secrets
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
            - name: home
              emptyDir:
                sizeLimit: 4Gi
